[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofactor-network-analysis"
version = "0.1.0"
description = "Tools for extracting and analyzing coordination networks around protein cofactors"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aaron LeDray"}
]
keywords = [
    "bioinformatics",
    "protein structure",
    "coordination network",
    "cofactor",
    "structural biology",
    "protein design",
    "alphafold",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "biopython>=1.79",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
yaml = [
    "pyyaml>=6.0",
]
webapp = [
    "streamlit>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/aaronledray/Protein-Cofactor_Coordination_Network_Analysis_Tools"
Repository = "https://github.com/aaronledray/Protein-Cofactor_Coordination_Network_Analysis_Tools"
Issues = "https://github.com/aaronledray/Protein-Cofactor_Coordination_Network_Analysis_Tools/issues"

[project.scripts]
sscna = "modules.cli:run_sscna"
stsqnc = "modules.cli:run_stsqnc"
stmqnc = "modules.cli:run_stmqnc"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
