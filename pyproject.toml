[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordination-network-identifier"
version = "0.2.1"
description = "Identify protein coordination networks around cofactors."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "0BSD"}
dependencies = [
  "biopython>=1.85",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
interactions = ["pdbe-arpeggio==1.4.4"]

[tool.setuptools]
packages = ["modules"]
py-modules = [
  "batch_coordination_network",
  "compare_coordination_networks",
  "sscna_cli",
]

[project.scripts]
sscna = "sscna_cli:main"
compare-coordination-networks = "compare_coordination_networks:main"
type-coordination-interactions = "modules.interaction_cli:main"
